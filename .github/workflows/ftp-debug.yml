name: FTP debug (list tree)

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List FTP locations
        env:
          U: u606995444
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          probe() {
            echo "================ $1 ================"
            curl -s --connect-timeout 25 --user "$U:$P" "ftp://46.28.46.55$1" || echo "(missing or error)"
            echo
          }
          probe "/"
          probe "/admin/"
          probe "/images/"
          probe "/public_html/"
          probe "/public_html/admin/"
          probe "/public_html/public_html/"
          probe "/domains/"
