name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Never run two deployments at once.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Upload to live server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Lets the first push succeed (green) even before the FTP password
      # secret has been added. Once FTP_PASSWORD is set, deploys run for real.
      - name: Check FTP secret is configured
        id: check
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::FTP_PASSWORD secret is not set yet — skipping deploy. Add it under Settings → Secrets and variables → Actions, then re-run this workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # WHY THIS IS RETRIED THREE TIMES
      #
      # Hostinger's FTP server intermittently refuses to open the control
      # socket. Measured over the deploy history: 12 of the 28 first attempts
      # since 2026-06-05 failed this way. Every one of them times out at the
      # full 120s with "Failed to connect" and NOT ONE file transferred, so the
      # connection is never established and a retry cannot corrupt a partial
      # upload.
      #
      # Raising the timeout was already tried (30s -> 120s, commit 83a43fb) and
      # did not fix it. Re-running the identical commit minutes later does -
      # every manual re-run in the history succeeded. So the workflow now does
      # that re-run itself.
      #
      # This matters because a failed deploy is SILENT in the worst way: the
      # commit is on GitHub, the change looks shipped, and the live site quietly
      # stays on the old version. That happened twice on 2026-07-28 and was only
      # caught because someone checked by hand.
      #
      # The gate is `outcome`, not `conclusion`. Per GitHub's contexts docs,
      # `outcome` is the result BEFORE continue-on-error is applied and
      # `conclusion` is the result AFTER - with continue-on-error: true a failed
      # step reports conclusion == 'success', so gating on conclusion would mean
      # the retry never fires.
      #
      # The final attempt deliberately has NO continue-on-error: if all three
      # fail the job goes red, because that is a real outage and must not be
      # hidden by the retry.
      # ---------------------------------------------------------------------

      - name: Deploy via FTP (attempt 1 of 3)
        id: ftp1
        if: steps.check.outputs.ready == 'true'
        continue-on-error: true
        uses: ./.github/actions/ftp-upload
        with:
          password: ${{ secrets.FTP_PASSWORD }}

      - name: Wait before attempt 2
        if: steps.check.outputs.ready == 'true' && steps.ftp1.outcome == 'failure'
        run: |
          echo "::warning::FTP attempt 1 failed — retrying in 60s."
          sleep 60

      - name: Deploy via FTP (attempt 2 of 3)
        id: ftp2
        if: steps.check.outputs.ready == 'true' && steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: ./.github/actions/ftp-upload
        with:
          password: ${{ secrets.FTP_PASSWORD }}

      - name: Wait before attempt 3
        if: steps.check.outputs.ready == 'true' && steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: |
          echo "::warning::FTP attempt 2 failed — final retry in 60s."
          sleep 60

      # No continue-on-error here on purpose: if this one fails the job fails.
      - name: Deploy via FTP (attempt 3 of 3 — final)
        id: ftp3
        if: steps.check.outputs.ready == 'true' && steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: ./.github/actions/ftp-upload
        with:
          password: ${{ secrets.FTP_PASSWORD }}

      # Records which attempt won, so the retry never silently masks a server
      # that is getting steadily worse. If this line starts reading "attempt 3"
      # regularly, the FTP host needs fixing, not more retries.
      - name: Report which attempt succeeded
        if: always() && steps.check.outputs.ready == 'true'
        run: |
          if [ "${{ steps.ftp1.outcome }}" = "success" ]; then
            echo "### Deployed on attempt 1" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.ftp2.outcome }}" = "success" ]; then
            echo "### Deployed on attempt 2 (attempt 1 failed to connect)" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.ftp3.outcome }}" = "success" ]; then
            echo "### Deployed on attempt 3 (attempts 1 and 2 failed to connect)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deploy FAILED after 3 attempts — the live site is still on the previous version" >> "$GITHUB_STEP_SUMMARY"
          fi
